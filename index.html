<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholaris Learning — Online Education Platform</title>
<meta name="description" content="Scholaris offers free courses in mathematics, science, literature, and history for learners of all ages.">
<meta property="og:title" content="Scholaris Learning — Online Education Platform">
<meta property="og:description" content="Free, rigorous courses in mathematics, science, literature, and history — taught by experienced educators.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230c1722'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23e2cfa9' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --radius:.25rem;
  --ink:#0c1722; --paper:#f4eee1; --brass:#ad8748; --brass-soft:#e2cfa9; --steel:#2c4962;
  --background:#f4eee1; --foreground:#0c1722; --card:#fcfaf4; --card-foreground:#0c1722;
  --primary:#0c1722; --primary-foreground:#f7f3e9; --muted:#e8e2d5; --muted-foreground:#4f5964;
  --accent:#ad8748; --accent-foreground:#0c1722; --destructive:#ba2b28; --destructive-foreground:#fbf8f1;
  --border:rgba(12,23,34,.14); --input:rgba(12,23,34,.2); --ring:#ad8748;
  --font-display:"Libre Baskerville","Iowan Old Style",Georgia,serif;
  --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
html.dark{
  --ink:#0c1722; --paper:#f4eee1; --brass:#c7a669; --brass-soft:#e2cfa9; --steel:#708aa0;
  --background:#08111b; --foreground:#f1ece1; --card:#111d29; --card-foreground:#f1ece1;
  --primary:#f1ece1; --primary-foreground:#08111b; --muted:#192532; --muted-foreground:#9aa6b3;
  --accent:#c7a669; --accent-foreground:#08111b; --destructive:#ec5b57;
  --border:rgba(244,238,225,.16); --input:rgba(244,238,225,.22); --ring:#c7a669;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--background);color:var(--foreground);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.font-display{font-family:var(--font-display)}
.eyebrow{font-family:var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);font-size:.6875rem;font-weight:600}
.wrap{max-width:72rem;margin:0 auto;padding:0 1.5rem}
.topbar{background:var(--ink);color:var(--paper)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 1.5rem;max-width:72rem;margin:0 auto;font-size:11px;letter-spacing:.04em}
.topbar .eyebrow{color:rgba(244,238,225,.7)}
.topbar-right{color:rgba(244,238,225,.6)}
@media(max-width:767px){.topbar-right{display:none}}
header.site{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--background) 92%,transparent);backdrop-filter:blur(8px)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:1rem 1.5rem;max-width:72rem;margin:0 auto}
.brand{display:flex;align-items:center;gap:.75rem}
.crest{width:2.25rem;height:2.25rem;border-radius:2px;background:var(--ink);color:var(--brass-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1.25rem;border:1px solid var(--border)}
.brand-name{font-family:var(--font-display);font-size:1.125rem;letter-spacing:-.01em;line-height:1}
.brand-sub{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;margin-top:.25rem}
nav.main{display:flex;align-items:center;gap:1.75rem;font-size:.875rem}
nav.main a{color:color-mix(in oklab,var(--foreground) 80%,transparent);transition:color .15s;position:relative}
nav.main a:hover{color:var(--foreground)}
nav.main a.active{color:var(--brass);font-weight:500}
nav.main a.active::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--brass)}
.nav-actions{display:flex;align-items:center;gap:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.25rem;font-size:.75rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;transition:all .15s;border:1px solid transparent}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{background:var(--steel)}
html.dark .btn-ink{background:var(--brass);color:var(--ink)}
html.dark .btn-ink:hover{background:var(--brass-soft)}
.btn-outline{border-color:var(--input);color:var(--foreground)}
.btn-outline:hover{border-color:var(--brass);color:var(--brass)}
.btn-brass{background:var(--brass);color:var(--ink)}
.btn-brass:hover{background:var(--brass-soft)}
.btn-ghost{color:var(--muted-foreground)}
.btn-ghost:hover{color:var(--foreground)}
.btn-sm{padding:.5rem .9rem;font-size:.6875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hamburger{display:none;padding:.5rem}
@media(max-width:900px){nav.main{display:none}nav.main.open{display:flex;position:absolute;top:100%;left:0;right:0;background:var(--background);border-bottom:1px solid var(--border);flex-direction:column;align-items:flex-start;padding:1rem 1.5rem;gap:1rem}.hamburger{display:block}}
.hero{padding:4rem 0 3rem;border-bottom:1px solid var(--border)}
.hero h1{font-family:var(--font-display);font-size:clamp(2.25rem,5vw,3.75rem);line-height:1.1;letter-spacing:-.02em;margin-top:1rem}
.hero h1 em{font-style:italic;color:var(--brass)}
.hero p.lede{margin-top:1.25rem;max-width:42rem;font-size:1rem;line-height:1.7;color:var(--muted-foreground)}
.hero-cta{display:flex;gap:.75rem;margin-top:2rem;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:3rem}
.stat{background:var(--card);padding:1.25rem;text-align:center}
.stat b{font-family:var(--font-display);font-size:1.75rem;display:block}
.stat span{font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.section{padding:4rem 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.section-head h2{font-family:var(--font-display);font-size:clamp(1.75rem,3vw,2.5rem);letter-spacing:-.01em;margin-top:.5rem}
.featured{border:1px solid var(--border);background:var(--card);padding:2rem;display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center}
.featured h3{font-family:var(--font-display);font-size:1.75rem;margin:.5rem 0}
.featured p{color:var(--muted-foreground);font-size:.875rem;line-height:1.7}
.featured-art{background:linear-gradient(135deg,var(--ink),var(--steel));color:var(--paper);min-height:180px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:3rem;border:1px solid var(--border)}
@media(max-width:768px){.featured{grid-template-columns:1fr}}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
@media(max-width:768px){.subjects{grid-template-columns:1fr}}
.subject{border:1px solid var(--border);background:var(--card);padding:1.5rem;transition:border-color .15s}
.subject:hover{border-color:var(--brass)}
.subject-num{font-family:var(--font-display);color:var(--brass);font-size:.875rem}
.subject h3{font-family:var(--font-display);font-size:1.375rem;margin:.25rem 0 .5rem}
.subject p{font-size:.875rem;color:var(--muted-foreground);line-height:1.6}
.subject-meta{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;font-size:.75rem;color:var(--muted-foreground)}
.subject ul{margin-top:.75rem;border-top:1px solid var(--border);padding-top:.75rem;display:none;list-style:none}
.subject.open ul{display:block}
.subject li{font-size:.8125rem;padding:.25rem 0;color:var(--muted-foreground)}
.subject li::before{content:"— ";color:var(--brass)}
.theatre-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:768px){.theatre-grid{grid-template-columns:1fr}}
.lesson-card{border:1px solid var(--border);background:var(--card);padding:1.5rem}
.lesson-card h3{font-family:var(--font-display);font-size:1.25rem;margin:.5rem 0}
.lesson-card p{font-size:.8125rem;color:var(--muted-foreground)}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid var(--border);margin-top:1rem}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;background:linear-gradient(135deg,var(--ink),var(--steel));color:var(--paper);text-align:center;padding:1rem}
.play-btn{width:3.5rem;height:3.5rem;border-radius:50%;background:var(--brass);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media(max-width:900px){.quotes{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.quotes{grid-template-columns:1fr}}
.quote{border:1px solid var(--border);background:var(--card);padding:1.5rem}
.quote blockquote{font-family:var(--font-display);font-size:.9375rem;line-height:1.6;font-style:italic}
.quote footer{margin-top:1rem;font-size:.75rem;color:var(--muted-foreground)}
.quote footer b{color:var(--foreground);display:block;font-size:.8125rem}
.schools{display:flex;flex-wrap:wrap;gap:.5rem}
.school{border:1px solid var(--border);background:var(--card);padding:.5rem 1rem;font-size:.8125rem}
.faq-cat{margin-bottom:2rem}
.faq-cat h3{font-family:var(--font-display);font-size:1.25rem;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
details.faq{border-bottom:1px solid var(--border)}
details.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:1.5rem;padding:1rem 0;font-size:.9375rem;font-weight:500}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .plus{color:var(--brass);transition:transform .3s;font-size:1.125rem}
details.faq[open] summary .plus{transform:rotate(45deg)}
details.faq p{padding:0 0 1.25rem;font-size:.875rem;line-height:1.7;color:var(--muted-foreground);max-width:48rem}
footer.site{border-top:1px solid var(--border);background:color-mix(in oklab,var(--card) 60%,transparent);padding:3rem 0 2rem;margin-top:2rem}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr 1fr}}
.footer-grid h4{font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:.75rem}
.footer-grid a,.footer-grid button{display:block;font-size:.875rem;padding:.25rem 0;color:color-mix(in oklab,var(--foreground) 80%,transparent);text-align:left}
.footer-grid a:hover,.footer-grid button:hover{color:var(--brass)}
.footer-bottom{margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted-foreground);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(12,23,34,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .2s}
.modal{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);width:100%;max-width:28rem;max-height:90vh;overflow-y:auto;padding:1.75rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);animation:zoomIn .3s}
.modal.wide{max-width:56rem}
.modal h2{font-family:var(--font-display);font-size:1.375rem;margin:.5rem 0 1rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted-foreground);margin-bottom:.375rem}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--input);background:var(--background);padding:.625rem .75rem;font-size:.875rem;border-radius:2px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ring);outline-offset:1px;border-color:var(--brass)}
.field .hint{font-size:.75rem;color:var(--muted-foreground);margin-top:.375rem}
.field .error{font-size:.75rem;color:var(--destructive);margin-top:.375rem}
.code-input{font-family:var(--font-mono);font-size:1.5rem!important;letter-spacing:.5em;text-align:center}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--paper);padding:.75rem 1.25rem;font-size:.875rem;border:1px solid var(--border);box-shadow:0 10px 25px rgba(0,0,0,.2);animation:fadeIn .2s;max-width:90vw;text-align:center}
html.dark .toast{background:var(--brass);color:var(--ink)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .5s ease both}
.practice-layout{display:grid;grid-template-columns:280px 1fr;gap:2rem;align-items:start}
@media(max-width:900px){.practice-layout{grid-template-columns:1fr}}
.topic-btn{display:block;width:100%;border:1px solid var(--border);background:color-mix(in oklab,var(--card) 60%,transparent);padding:.75rem 1rem;text-align:left;transition:all .15s;margin-bottom:.375rem}
.topic-btn:hover{border-color:color-mix(in oklab,var(--brass) 50%,transparent);color:var(--foreground)}
.topic-btn.active{border-color:var(--brass);background:color-mix(in oklab,var(--brass) 10%,transparent);color:var(--foreground)}
.topic-btn .t{font-family:var(--font-display);font-size:.875rem;font-weight:600}
.topic-btn .l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;margin-top:.25rem}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;text-align:center;margin-bottom:1.5rem}
.stat3>div{border:1px solid var(--border);background:var(--card);padding:.75rem 1rem}
.stat3 b{font-family:var(--font-display);font-size:1.5rem;display:block}
.choice{display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid var(--border);background:var(--background);padding:.875rem 1.25rem;text-align:left;font-size:.875rem;width:100%;transition:all .15s;margin-bottom:.5rem}
.choice:hover:not(:disabled){border-color:var(--brass);background:color-mix(in oklab,var(--brass) 5%,transparent)}
.choice.correct{border-color:#00bb7f;background:rgba(0,187,127,.1);font-weight:500}
.choice.wrong{border-color:var(--destructive);background:color-mix(in oklab,var(--destructive) 10%,transparent);color:var(--destructive);font-weight:500}
.choice:disabled{cursor:not-allowed}
.choice.dim{opacity:.5}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
@media(max-width:900px){.pricing-grid{grid-template-columns:1fr}}
.plan{position:relative;border:1px solid var(--border);background:var(--card);padding:2rem;display:flex;flex-direction:column;transition:border-color .15s}
.plan:hover{border-color:color-mix(in oklab,var(--brass) 50%,transparent)}
.plan.highlight{border-color:var(--brass)}
.plan .badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--brass);color:var(--ink);padding:.25rem .75rem;font-family:var(--font-display);font-size:10px;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.plan h2{font-family:var(--font-display);font-size:1.5rem}
.plan .tag{font-size:.75rem;color:var(--muted-foreground);margin-top:.5rem;min-height:2.5rem;line-height:1.5}
.plan .price{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:1rem 0;margin:1.5rem 0}
.plan .price b{font-family:var(--font-display);font-size:2.25rem}
.plan ul{list-style:none;flex:1;margin-bottom:2rem}
.plan li{display:flex;gap:.625rem;align-items:baseline;font-size:.75rem;color:var(--muted-foreground);padding:.375rem 0}
.plan li::before{content:"✓";color:var(--brass);font-weight:700}
.toggle{display:inline-flex;border:1px solid var(--border);background:var(--card);padding:.25rem;gap:.25rem}
.toggle button{padding:.5rem 1rem;font-size:.75rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.toggle button.on{background:var(--ink);color:var(--paper)}
html.dark .toggle button.on{background:var(--brass);color:var(--ink)}
.institutional{background:var(--ink);color:var(--paper);padding:2rem;margin-top:5rem}
html.dark .institutional{background:var(--card);border:1px solid var(--border)}
.institutional-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:2.5rem;align-items:center}
@media(max-width:900px){.institutional-grid{grid-template-columns:1fr}}
.seat{border:1px solid rgba(244,238,225,.15);background:rgba(244,238,225,.05);padding:1.25rem;margin-bottom:1rem}
html.dark .seat{border-color:var(--border);background:var(--muted)}
.games-toolbar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem}
.games-toolbar input[type=search]{flex:1;min-width:200px;border:1px solid var(--input);background:var(--card);padding:.625rem .875rem;font-size:.875rem}
.games-toolbar select{border:1px solid var(--input);background:var(--card);padding:.625rem .75rem;font-size:.875rem}
.games-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:1000px){.games-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.games-grid{grid-template-columns:repeat(2,1fr)}}
.game-card{border:1px solid var(--border);background:var(--card);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;padding:0;width:100%}
.game-card:hover{border-color:var(--brass);transform:translateY(-2px)}
.game-thumb{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2rem;color:#fff;position:relative;overflow:hidden}
.game-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.game-info{padding:.75rem}
.game-info h4{font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-info .meta{font-size:.6875rem;color:var(--muted-foreground);display:flex;justify-content:space-between;margin-top:.25rem}
.genre-tag{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.125rem .5rem;color:#fff}
.player-bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.player-frame{width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--border)}
.player-frame iframe{width:100%;height:100%;border:0}
.vote-btn{border:1px solid var(--input);padding:.375rem .75rem;font-size:.75rem}
.vote-btn.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.panic{position:fixed;bottom:3rem;right:.75rem;z-index:60;width:3.5rem;height:3.5rem;border-radius:50%;background:#dc2626;color:#fff;font-weight:700;font-size:.625rem;letter-spacing:.05em;box-shadow:0 4px 12px rgba(220,0,0,.5);cursor:grab;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
.panic:active{cursor:grabbing}
.admin-shell{background:#09090b;color:#f4f4f5;min-height:100vh;padding:2.5rem 1.5rem}
.admin-shell .card{border:1px solid #27272a;background:#18181b;padding:1.5rem;margin-bottom:1.5rem}
.admin-shell input,.admin-shell select,.admin-shell textarea{background:#09090b;border:1px solid #3f3f46;color:#f4f4f5;padding:.5rem .75rem;font-size:.875rem;width:100%;border-radius:.375rem}
.admin-shell label{font-size:.75rem;color:#a1a1aa;display:block;margin-bottom:.375rem}
.admin-shell .btn-admin{background:linear-gradient(90deg,#fbbf24,#3b82f6);color:#000;font-weight:600;padding:.5rem 1rem;font-size:.8125rem;border-radius:.375rem}
.admin-shell .btn-admin:disabled{opacity:.4}
.admin-shell .btn-ghost2{border:1px solid #3f3f46;padding:.5rem 1rem;font-size:.8125rem;border-radius:.375rem;color:#e4e4e7}
.admin-shell .btn-ghost2:hover{border-color:#fff}
.admin-game{display:flex;gap:1rem;align-items:center;border:1px solid #27272a;background:#18181b;padding:.75rem;margin-bottom:.5rem;flex-wrap:wrap}
.admin-game img{width:4rem;height:2.5rem;object-fit:cover;border-radius:.25rem;background:#27272a}
.chat-shell{display:grid;grid-template-columns:240px 1fr;min-height:60vh;border:1px solid var(--border);background:var(--card)}
@media(max-width:700px){.chat-shell{grid-template-columns:1fr}.chat-side{display:none}}
.chat-side{border-right:1px solid var(--border);padding:1rem;background:color-mix(in oklab,var(--card) 60%,transparent)}
.chat-main{display:flex;flex-direction:column;min-height:400px}
.chat-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem;max-height:420px}
.msg{font-size:.875rem}
.msg .who{font-weight:600;font-size:.8125rem}
.msg .when{font-size:.6875rem;color:var(--muted-foreground);margin-left:.5rem}
.chat-input{display:flex;gap:.5rem;padding:.75rem;border-top:1px solid var(--border)}
.chat-input input{flex:1;border:1px solid var(--input);background:var(--background);padding:.5rem .75rem;font-size:.875rem}
.banner{background:var(--brass);color:var(--ink);padding:.625rem 1.5rem;font-size:.8125rem;display:flex;justify-content:space-between;gap:1rem;align-items:center}
.banner button{font-weight:700}
.kbd{border:1px solid var(--input);border-bottom-width:2px;padding:0 .375rem;font-size:.6875rem;font-family:var(--font-mono);border-radius:3px;background:var(--card)}
.progress-bar{height:.5rem;background:var(--muted);overflow:hidden}
.progress-bar>div{height:100%;background:var(--brass);transition:width .3s}
.table{width:100%;border-collapse:collapse;font-size:.8125rem}
.table th,.table td{border:1px solid var(--border);padding:.5rem .75rem;text-align:left}
.table th{background:var(--muted);font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase}

/* Standalone arcade shell */
body.arcade-mode{--background:#080e20;--foreground:#eef2ff;--card:#111a2d;--muted:#19233b;--muted-foreground:#929fb9;--border:#26324b;--input:#34415e;--brass:#f5bf4f;background:radial-gradient(ellipse at 75% 5%,#182447 0,transparent 55%),#080e20;color:#eef2ff;min-height:100vh}
body.arcade-mode>.topbar,body.arcade-mode>header.site,body.arcade-mode>footer.site,body.arcade-mode>#banner-slot{display:none}
.arcade-bar{height:72px;background:#090f1de8;border-bottom:1px solid #ffffff12;position:sticky;top:0;z-index:30;backdrop-filter:blur(16px)}
.arcade-bar-inner{max-width:1240px;margin:auto;padding:0 28px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.arcade-logo{font-size:20px;font-weight:850;letter-spacing:-.8px;display:flex;align-items:center;gap:10px}.arcade-logo i{font-style:normal;background:#f5bf4f;color:#111827;border-radius:9px;padding:4px 10px}.arcade-logo small{font-size:10px;letter-spacing:2px;color:#71819e;margin-left:8px}
.arcade-actions{display:flex;gap:8px}.arcade-actions button,.arcade-tool button{border:1px solid #34415e;border-radius:8px;padding:9px 14px;font-size:12px;min-height:40px;background:#131d31}
.arcade-main{max-width:1240px;margin:auto;padding:42px 28px 70px}.arcade-hero{display:flex;justify-content:space-between;align-items:center;gap:28px;padding:12px 0 40px}.arcade-hero h1{font-family:var(--font-body);font-size:clamp(34px,5vw,58px);line-height:1.08;font-weight:800;letter-spacing:-2px;margin:12px 0 16px}.arcade-hero h1 em{font-style:normal;color:#f5bf4f}.arcade-hero p{color:#94a3bd;font-size:14px;max-width:440px}.arcade-hero .eyebrow{color:#f5bf4f;font-size:10px}.arcade-hero-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.arcade-hero-buttons button{border-radius:8px;min-height:44px;padding:10px 18px;border:1px solid #34415e;font-size:13px;font-weight:600}.arcade-hero-buttons .primary{background:#f5bf4f;color:#101522;border-color:#f5bf4f}
.arcade-art{width:330px;flex-shrink:0;position:relative;height:220px;display:flex;align-items:center;justify-content:center}.arcade-art img{width:134px;height:174px;object-fit:cover;border-radius:14px;border:3px solid #34415e;box-shadow:0 20px 35px #0008;position:absolute;transform:rotate(-16deg) translateX(-84px)}.arcade-art img:nth-child(2){transform:rotate(15deg) translateX(84px)}.arcade-art img:nth-child(3){transform:rotate(-2deg);border-color:#f5bf4f;z-index:2}.arcade-art span{position:absolute;bottom:-5px;right:2px;transform:rotate(-7deg);background:#f5bf4f;color:#111827;font-size:11px;font-weight:800;padding:6px 10px;border-radius:5px;z-index:3}
.arcade-tool{background:#0c1425;border:1px solid #25314b;border-radius:12px;padding:18px;margin-bottom:26px}.arcade-search-row{display:flex;gap:12px;align-items:end}.arcade-search-row label{display:flex;flex-direction:column;gap:7px;font-size:10px;letter-spacing:1px;color:#929fb9}.arcade-search-row label:first-child{flex:1}.arcade-search-row input,.arcade-search-row select{background:#131e33;border:1px solid #34415e;border-radius:7px;padding:11px 12px;min-height:44px;color:#f0f4ff;width:100%}.genre-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.genre-chips button{padding:6px 10px;min-height:32px;border:1px solid var(--chip);background:color-mix(in srgb,var(--chip) 10%,#0c1425);color:var(--chip);font-size:10px;text-transform:uppercase;letter-spacing:.6px;border-radius:5px}.genre-chips button.active{background:var(--chip);color:#0b1020;font-weight:800}.genre-chips b{opacity:.6;margin-left:5px}.arcade-results{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;font-size:12px;color:#929fb9}.arcade-results strong{color:#f0f4ff;font-size:16px}
.arcade-mode .games-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.arcade-mode .game-card{background:#10192c;border:1px solid var(--edge,#34415e);border-radius:10px;overflow:hidden;text-align:left;transition:transform .18s,box-shadow .18s;position:relative}.arcade-mode .game-card:hover{transform:translateY(-5px);box-shadow:0 10px 28px #0007}.arcade-mode .game-thumb{aspect-ratio:1/1}.arcade-mode .game-thumb>span:not(.genre-tag){display:none}.arcade-mode .game-thumb .genre-tag{font-family:var(--font-body);font-size:8px;padding:3px 6px;border-radius:4px;color:#0a1020;letter-spacing:.3px}.arcade-mode .game-info{padding:10px}.arcade-mode .game-info h4{font-family:var(--font-body);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}.arcade-mode .game-info .meta{font-size:10px;color:#929fb9;display:flex;flex-direction:column;align-items:start;gap:7px}.arcade-mode .game-info .meta span:last-child{border-top:1px solid #ffffff0d;padding-top:7px;width:100%;color:#d6b76c}.arcade-mode .btn{border-radius:7px}.arcade-mode :focus-visible{outline:2px solid #f5bf4f;outline-offset:4px}.arcade-mode .player-frame{border-radius:8px;overflow:hidden}.arcade-mode .panic{opacity:.65}
@media(min-width:1600px){.arcade-main,.arcade-bar-inner{max-width:1400px}.arcade-mode .games-grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(max-width:1050px){.arcade-mode .games-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.arcade-logo small{display:none}}
@media(max-width:650px){.arcade-main{padding:24px 16px 50px}.arcade-bar-inner{padding:0 16px}.arcade-actions button{padding:8px;font-size:11px}.arcade-hero{gap:0;padding-bottom:28px}.arcade-art{display:none}.arcade-search-row{flex-wrap:wrap}.arcade-search-row label:first-child{flex-basis:100%}.arcade-search-row label:nth-child(2){flex:1}.arcade-mode .games-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.arcade-mode .game-info{padding:8px}.arcade-hero h1{letter-spacing:-1px}.arcade-results>span{display:none}}
@media(prefers-reduced-motion:reduce){.arcade-mode *{scroll-behavior:auto!important;transition:none!important}}

"use strict";
/* ============================================================
   Scholaris — single-file portable build
   Storage: IndexedDB (scholaris-db) + localStorage (compat keys)
   No backend. All Supabase / edge-function behaviour is local.
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
async function sha256(text){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toast-slot").appendChild(t);setTimeout(()=>t.remove(),3200)}
function openModal(html,wide){$("#modal-slot").innerHTML=`<div class="modal-backdrop" id="modal-back"><div class="modal${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;$("#modal-back").addEventListener("click",e=>{if(e.target.id==="modal-back")closeModal()});const f=$("#modal-slot input,#modal-slot select,#modal-slot textarea,#modal-slot button");if(f)f.focus()}
function closeModal(){$("#modal-slot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

/* ---------- IndexedDB ---------- */
const DB_NAME="scholaris-db",DB_VER=1;
const STORES=["users","sessions","progress","adminGames","customGames","gameStats","votes","messages","channels","settings","broadcasts","contacts","enrollments","audit"];
let _db=null;
function dbOpen(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=()=>{const d=r.result;for(const s of STORES){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})}};r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function dbGet(store,id){const d=await dbOpen();return new Promise((res,rej)=>{const tx=d.transaction(store,"readonly");const rq=tx.objectStore(store).get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error)})}
async function dbAll(store){const d=await dbOpen();return new Promise((res,rej)=>{const tx=d.transaction(store,"readonly");const rq=tx.objectStore(store).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)})}
async function dbPut(store,obj){const d=await dbOpen();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");const rq=tx.objectStore(store).put(obj);rq.onsuccess=()=>res(obj);rq.onerror=()=>rej(rq.error)})}
async function dbDel(store,id){const d=await dbOpen();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");const rq=tx.objectStore(store).delete(id);rq.onsuccess=()=>res(true);rq.onerror=()=>rej(rq.error)})}
async function dbClear(store){const d=await dbOpen();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");const rq=tx.objectStore(store).clear();rq.onsuccess=()=>res(true);rq.onerror=()=>rej(rq.error)})}
async function audit(action,detail){try{await dbPut("audit",{id:uid(),action,detail:String(detail||""),at:nowISO()})}catch(e){}}
/* localStorage compat helpers (same keys as original build) */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
/* Cross-tab sync (replaces Supabase Realtime) */

{cat:"Signing up & accounts",items:[
["My verification code never arrived.","Codes are issued instantly when you finish the sign-up form, but they're delivered by email, so they can be delayed by school mail filters, a full inbox, or a typo in the address you entered. Check your spam and quarantine folders first, then use the Resend code button — it's rate-limited to one request per minute to stop duplicate codes cancelling each other out. If two resends still don't land, sign up again with a personal address and add your school email later from your profile."],
["How long is the 5-digit code valid for?","Fifteen minutes. After that it expires and you'll need a fresh one. Codes are single-use: once a code has been entered successfully it can't be reused, even inside the fifteen-minute window."],
["Do I need a school email to sign up?","No. Any permanent email address works. A school address simply means we can verify your school automatically, and it's required if you want a teacher or year head to be able to see your progress reports."],
["Why do you ask for my date of birth?","It sets the right default reading level and content filters, and it tells us whether a guardian needs to be on the account. Learners under 16 should sign up with a parent or guardian present, using an email address the guardian checks."],
["Why do you ask what year or grade I'm in?","It decides which specification your subject index is mapped to — Junior Cycle, Transition Year, Leaving Certificate, or a university/adult track — so the practice questions start at a sensible difficulty instead of making you sit a placement test."],
["Can I sign up for someone else, like my child?","Yes. Choose \"Learner\", enter the learner's date of birth and year group, but use an email address you actually check — the verification code and all later correspondence go to the address on the form."],
["What happens once I've verified my code?","Your account is active immediately. The whole free library, the subject index and the adaptive practice sets unlock straight away — there's nothing to install and no payment step."],
["Can I change my email, year group or role later?","Yes. All four are editable from your account settings. Changing your email triggers a new 5-digit code to the new address; changing your year group re-maps your subject index but keeps every practice result you've already earned."]]},
{cat:"Courses & study",items:[
["Is Scholaris available in Ireland?","Yes — Ireland is our primary region. Content is mapped to the Junior Cycle and Leaving Certificate specifications (Higher and Ordinary level), including exam-paper walkthroughs, marking-scheme breakdowns and orals/aurals practice for languages."],
["Which subjects are covered?","Mathematics, English, Irish, the sciences (Biology, Chemistry, Physics, Science), Business, Geography, History, French, German and Spanish. Latin, Astronomy and Computer Science are available as enrichment tracks outside the exam specifications."],
["How are the lessons structured?","Each unit is a short video (8–15 minutes), a worked example set, then adaptive practice questions that get harder or easier based on your answers. A unit is marked complete once you clear a run of questions at the target difficulty, not just after watching the video."],
["How does the practice system decide what to ask me?","It tracks accuracy and answer time per skill. Get a run right and it moves you up a difficulty band; miss two in a row and it drops back, re-teaches the step you slipped on, then rebuilds. That's why the same topic can look different on two different days."],
["Do I get anything at the end of a course?","You get a completion summary — units cleared, accuracy per topic, and a printable progress report. Scholaris is a revision and enrichment platform, so these are study records, not State-recognised qualifications."],
["Can I use Scholaris on a phone or tablet?","Yes. Everything works in a mobile browser, including the videos and the practice questions. Longer written-answer tasks are easier on a laptop."]]},
{cat:"Teachers & schools",items:[
["Can teachers use Scholaris with a class?","Yes. Choose \"Teacher\" when you sign up and you can request a class pack: a shared roster, assignable practice sets, per-student accuracy breakdowns, and printable worksheets with answer keys."],
["Can I see how my students are doing?","Class packs include a progress view showing per-student unit completion and per-topic accuracy, so you can spot a topic the whole class is missing before the next test."],
["Do you offer whole-school access?","Yes — the Institution plan on the pricing page covers unlimited staff and student accounts, bulk enrolment by CSV, and a single invoice. Bulk pricing is quoted per school size."]]},
{cat:"Pricing, privacy & support",items:[
["Are the courses actually free?","The core video library, the subject index and the adaptive practice questions are free with no time limit. Optional paid extras are one-to-one tutoring, exam-paper marking, and the school/teacher tools."],
["Will I be charged automatically?","No. There is no card required to enrol, and free accounts never convert to paid on their own. Paid plans are started deliberately from the pricing page."],
["What data do you store about me?","Your name, email, role, year group and your practice results. Accessibility settings such as text size and light or dark mode are stored only in your own browser, never on our servers. See the Privacy link in the footer for the full detail."],
["How do I change text size or switch to dark mode?","Use the Accessibility link in the footer. Text size and light/dark mode are saved on your device and apply across the whole site, including lesson pages."],
["Something is broken or a video won't load.","Use the Contact link in the footer with the page name and what you were doing. Videos are hosted externally, so a blocked or filtered school network is the most common cause — try the same lesson on a home connection to confirm."]]}];

/* ---------- Auth (local replacement for Supabase Auth + /api/check-email) ---------- */
let currentUser=null;
async function loadSession(){const sid=LS.get("scholaris.session",null);if(!sid)return null;const s=await dbGet("sessions",sid);if(!s)return null;if(new Date(s.expires)<new Date()){await dbDel("sessions",sid);LS.del("scholaris.session");return null}const u=await dbGet("users",s.userId);return u||null}
async function saveSession(userId){const id=uid();await dbPut("sessions",{id,userId,created:nowISO(),expires:new Date(Date.now()+30*24*3600*1000).toISOString()});LS.set("scholaris.session",id)}
async function logout(){const sid=LS.get("scholaris.session",null);if(sid)await dbDel("sessions",sid);LS.del("scholaris.session");currentUser=null;renderAuthSlot();render();toast("Signed out.")}
function isDisposableEmail(email){const d=(email||"").split("@")[1]?.toLowerCase()||"";return["mailinator.com","tempmail.com","10minutemail.com","guerrillamail.com","throwawaymail.com"].includes(d)}
function genCode(){return String(Math.floor(10000+Math.random()*90000))}
let pendingSignup=null,pendingCode=null,resendTimer=null;
async function startSignup(data){
  if(isDisposableEmail(data.email))return{ok:false,reason:"disposable",error:"That looks like a temporary/disposable email address. Please use a permanent email you can actually receive replies on."};
  const users=await dbAll("users");if(users.some(u=>u.email.toLowerCase()===data.email.toLowerCase()))return{ok:false,reason:"exists",error:"An account with this email already exists. Try signing in instead."};
  const code=genCode();pendingSignup={...data,codeHash:await sha256(code),codeExp:Date.now()+15*60*1000,created:nowISO()};pendingCode=code;
  return{ok:true,code};
}
async function verifySignup(code){
  if(!pendingSignup)return{ok:false,error:"No pending sign-up. Please start again."};
  if(Date.now()>pendingSignup.codeExp)return{ok:false,error:"This code has expired (15 minutes). Please request a new one."};
  if(await sha256(code.trim())!==pendingSignup.codeHash)return{ok:false,error:"Incorrect code. Please try again."};
  const{ codeHash,codeExp,...rest}=pendingSignup;
  const user={id:uid(),...rest,verified:true,created:nowISO()};
  user.passwordHash=await sha256(user.password);delete user.password;
  await dbPut("users",user);pendingSignup=null;pendingCode=null;
  await saveSession(user.id);currentUser=user;await audit("signup",user.email);
  return{ok:true,user};
}
async function login(email,password){
  const users=await dbAll("users");const u=users.find(x=>x.email.toLowerCase()===email.toLowerCase());
  if(!u||u.passwordHash!==await sha256(password))return{ok:false,error:"User ID or password is incorrect. Please check your credentials and try again."};
  await saveSession(u.id);currentUser=u;await audit("login",u.email);return{ok:true,user:u};
}
async function getProgress(userId){const all=await dbAll("progress");return all.filter(p=>p.userId===userId)}
async function saveProgress(userId,topicId,patch){const id=userId+":"+topicId;const cur=await dbGet("progress",id)||{id,userId,topicId,answered:0,correct:0,streak:0,bestStreak:0,updated:nowISO()};const next={...cur,...patch,updated:nowISO()};await dbPut("progress",next);return next}

async function getSettings(){const s=await dbGet("settings","main");return s||{id:"main",broadcast:{enabled:false,text:"",image:"",link:"",bg:"#ad8748",fg:"#0c1722",dismissible:true,updated:""},patchNotes:"# Patch Notes\n\nNothing here yet.",patchVersion:"",hiddenGameUrls:[],siteTheme:null,splashTexts:SPLASH_MEMES.join("\n"),splashImages:[],panic:{hidden:false,img:"",openInBlank:false},arcadeTheme:{accent:"amber",panicImg:""}}}
async function saveSettings(patch){const cur=await getSettings();const next={...cur,...patch,id:"main"};await dbPut("settings",next);broadcast("settings",next);return next}
async function renderBanner(){const s=await getSettings();const b=s.broadcast;const slot=$("#banner-slot");if(!b||!b.enabled||!b.text){slot.innerHTML="";return}const dismissed=LS.get("scholaris.bannerDismissed","");if(dismissed===b.updated){slot.innerHTML="";return}
  slot.innerHTML=`<div class="banner" style="background:${esc(b.bg||"#ad8748")};color:${esc(b.fg||"#0c1722")}"><span>${b.link?`<a href="${esc(b.link)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(b.text)}</a>`:esc(b.text)}</span>${b.dismissible!==false?`<button id="banner-x" aria-label="Dismiss announcement">✕</button>`:""}</div>`;
  const x=$("#banner-x");if(x)x.onclick=()=>{LS.set("scholaris.bannerDismissed",b.updated||"");renderBanner()}}
function renderPanic(){const slot=$("#panic-slot");if(!arcadeVisible){slot.innerHTML="";return}const t=LS.get("arcade.theme",{panicHidden:false});if(t.panicHidden){slot.innerHTML="";return}
  slot.innerHTML=`<div class="panic" id="panic-btn" title="Panic (drag to move)">Panic</div>`;
  const el=$("#panic-btn");let drag=null;
  el.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,moved:false};el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;el.style.left=Math.max(0,Math.min(window.innerWidth-56,drag.l+dx))+"px";el.style.top=Math.max(0,Math.min(window.innerHeight-56,drag.t+dy))+"px";el.style.right="auto";el.style.bottom="auto"});
  el.addEventListener("pointerup",()=>{if(drag&&!drag.moved){arcadeVisible=false;gamesFilter.playing=null;history.replaceState(null,"","#/");render();renderPanic()}drag=null});
  el.addEventListener("keydown",e=>{if(e.key==="Escape"){arcadeVisible=false;gamesFilter.playing=null;history.replaceState(null,"","#/");render();renderPanic()}})}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal-slot").innerHTML){/* panic via Esc handled on button; also global */}});
/* ---------- Games data layer (replaces admin_games + game_stats + vote_game) ---------- */
async function getAdminGames(){const all=await dbAll("adminGames");return all.sort((a,b)=>new Date(b.added_at)-new Date(a.added_at))}
async function getCustomGames(){const all=await dbAll("customGames");return all.sort((a,b)=>new Date(b.added)-new Date(a.added))}
async function getAllGames(){
  const admin=await getAdminGames();const custom=await getCustomGames();const settings=await getSettings();const hidden=new Set(settings.hiddenGameUrls||[]);
  const builtin=BUILTIN_GAMES.map(g=>({...g,source:"builtin",id:"builtin:"+g.url}));
  const adminMapped=admin.map(g=>({name:g.name,img:g.img||"/game-soundboard.svg",url:`admin:${g.id}`,genre:g.genre,device:g.device,added:g.added_at,source:"admin",launchUrl:g.url,id:g.id,html:g.html||""}));
  const customMapped=custom.map(g=>({name:g.name,img:g.img||"/game-soundboard.svg",url:`custom:${g.id}`,genre:g.genre,device:g.device,added:g.added,source:"custom",launchUrl:g.url,id:g.id,html:g.html||""}));
  const all=[...adminMapped,...customMapped,...builtin];
  return all.filter(g=>!hidden.has(g.url)&&g.url!=="/games/slime-rancher.html");
}
async function getStats(){const all=await dbAll("gameStats");const m={};for(const s of all)m[s.url]={plays:s.plays||0,likes:s.likes||0,dislikes:s.dislikes||0};return m}
async function bumpPlay(url){LS.set("arcade.lastPlayed",url);const cur=await dbGet("gameStats",url)||{id:url,url,plays:0,likes:0,dislikes:0};cur.plays=(cur.plays||0)+1;await dbPut("gameStats",cur);broadcast("games",{url});return cur}
async function voteGame(url,kind){const votes=LS.get("arcade.votes",{});const prev=votes[url]||null;let dl=0,dd=0;if(prev===kind){delete votes[url];if(kind==="like")dl=-1;else dd=-1}else{votes[url]=kind;if(kind==="like"){dl=1;if(prev==="dislike")dd=-1}else{dd=1;if(prev==="like")dl=-1}}
  LS.set("arcade.votes",votes);const cur=await dbGet("gameStats",url)||{id:url,url,plays:0,likes:0,dislikes:0};cur.likes=Math.max(0,(cur.likes||0)+dl);cur.dislikes=Math.max(0,(cur.dislikes||0)+dd);await dbPut("gameStats",cur);broadcast("games",{url});return{likes:cur.likes,dislikes:cur.dislikes,votes}}
function wrapGameHtml(html,gameName){const safe=esc(gameName||"Game");return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${safe}</title><style>html,body{margin:0;height:100%;background:#000}iframe{width:100%;height:100%;border:0}</style></head><body><script>var GAME=${JSON.stringify(gameName||"")};var store={};try{store=JSON.parse(localStorage.getItem("arcade.save."+GAME)||"{}")}catch(e){}window.addEventListener("message",function(e){if(e.data&&e.data.__arcadeSave===1){store=e.data.data;try{localStorage.setItem("arcade.save."+GAME,JSON.stringify(store))}catch(err){}try{parent.postMessage({__arcadeSave:1,game:GAME,data:store},"*")}catch(err){}}});<\/script>${html}</body></html>`}

identifying your captured\n                territories. Start a line somewhere outside of your area, make a\n                full circle and whatever you outlined will be yours. The\n                difficult part is avoiding attacks from your enemies \u2013 a chunk\n                of land is equally easy to capture for several players, so how\n                the round plays out depends solely on the skills, wit and\n                strategy of everyone involved.\n            \u003c/p>\n            \u003cp>\n                To make things even more complicated, Paper.io 2 is also a\n                browser game which allows laptop and desktop users to join the\n                fun wherever they are. Even if you don\u2019t have an internet\n                connection, there is a way for one player to enjoy all the same\n                mechanics, only he or she would be competing with AI. It might\n                be less intense, but is still a great way to kill some time when\n                you\u2019re bored.\n            \u003c/p>\n            \u003cp>\n                Among the thousands of IO games this one stands out because of\n                its tight gameplay that combines action with tactics. The fact\n                that the visuals and the play style are inspired by some of the\n                most renowned classic arcade titles helps too. Basically, you\n                can be a stay at home mom, a hardened MMO player or schoolkid in\n                an IT class \u2013 chances are, you will enjoy the experience and\n                have fun in multiplayer battles.\n            \u003c/p>\n            \u003cp>\n                What started as an indie game became a worldwide phenomenon and\n                Paper.io 2 is its rightful successor. The graphics are still\n                colorful and smooth, the controls are responsive and the\n                gameplay is better than ever, so now is a great time to check it\n                out if you ha   }

}

  <div style="display:flex;gap:.5rem"><button class="btn btn-ink" id="pf-save" style="flex:1">Save changes</button><button class="btn btn-outline" id="pf-out">Sign out</button></div>
  <button class="btn btn-ghost" id="pf-close" style="width:100%;margin-top:.5rem">Close</button>`);
  $("#pf-save").onclick=async()=>{currentUser.displayName=$("#pf-name").value.trim()||currentUser.displayName;currentUser.year=$("#pf-year").value.trim();await dbPut("users",currentUser);closeModal();renderAuthSlot();toast("Profile saved.")};
  $("#pf-out").onclick=()=>{closeModal();logout()};$("#pf-close").onclick=closeModal;
}
/* ---------- Footer modals ---------- */
function showFooterModal(kind){
  if(kind==="privacy")return openModal(`<h2>Privacy</h2><p style="font-size:.875rem;line-height:1.7;color:var(--muted-foreground)">We store your account email, lesson progress, and anonymous performance metrics. Accessibility settings such as text size and light/dark mode are stored only in your own browser, never on our servers. In this portable build, all data lives in your browser's IndexedDB/localStorage — nothing leaves your device. We use essential storage for sign-in and optional analytics you can disable in your browser.</p><button class="btn btn-ink" onclick="closeModal()" style="width:100%;margin-top:1rem">Close</button>`,true);
  if(kind==="terms")return openModal(`<h2>Terms</h2><p style="font-size:.875rem;line-height:1.7;color:var(--muted-foreground)">You are responsible for safeguarding your password and any activity under your account. Do not scrape, redistribute, or resell course materials without written permission. Most lessons are provided free of charge. Premium tracks may carry a separate subscription. Course content is provided for educational purposes.</p><button class="btn btn-ink" onclick="closeModal()" style="width:100%;margin-top:1rem">Close</button>`,true);
  if(kind==="a11y"){const size=Number(LS.get("a11y.textSize",100));const theme=LS.get("a11y.theme","light");return openModal(`<h2>Accessibility</h2><div class="field"><label>Text size (${size}%)</label><div style="display:flex;gap:.5rem;align-items:center"><button class="btn btn-outline btn-sm" id="a-dec">A−</button><input type="range" id="a-range" min="80" max="150" step="5" value="${size}" style="flex:1"><button class="btn btn-outline btn-sm" id="a-inc">A+</button></div></div><div class="field"><label>Theme</label><div style="display:flex;gap:.5rem"><button class="btn ${theme==="light"?"btn-ink":"btn-outline"} btn-sm" id="a-light">☀ Light</button><button class="btn ${theme==="dark"?"btn-ink":"btn-outline"} btn-sm" id="a-dark">☾ Dark</button></div><p class="hint">Saved on your device and applies across the whole site, including lesson pages.</p></div><button class="btn btn-ink" onclick="closeModal()" style="width:100%">Done</button>`);
    const sync=()=>{const v=Number($("#a-range").value);setTextSize(v);$("#a-range").previousElementSibling;const lbl=$("#a-range").closest(".field").querySelector("label");lbl.textContent=`Text size (${v}%)`};
    $("#a-range").oninput=sync;$("#a-dec").onclick=()=>{$("#a-range").value=Math.max(80,Number($("#a-range").value)-5);sync()};$("#a-inc").onclick=()=>{$("#a-range").value=Math.min(150,Number($("#a-range").value)+5);sync()};
    $("#a-light").onclick=()=>{setTheme("light");showFooterModal("a11y")};$("#a-dark").onclick=()=>{setTheme("dark");showFooterModal("a11y")}}
  if(kind==="contact")return openModal(`<h2>Contact</h2><p style="font-size:.875rem;color:var(--muted-foreground)">help@scholaris-learning.org · partners@scholaris-learning.org · 240 Library Lane, Suite 400, Cambridge, MA 02138</p><div class="field" style="margin-top:1rem"><label>Your name</label><input id="ct-name" value="${currentUser?esc(currentUser.name):""}"></div><div class="field"><label>Email</label><input id="ct-email" type="email" value="${currentUser?esc(currentUser.email):""}"></div><div class="field"><label>How can we help?</label><textarea id="ct-msg" rows="4"></textarea></div><button class="btn btn-ink" id="ct-send" style="width:100%">Send message</button>`);
    $("#ct-send").onclick=async()=>{const name=$("#ct-name").value.trim(),email=$("#ct-email").value.trim(),msg=$("#ct-msg").value.trim();if(!name||!email.includes("@")||!msg){toast("Please complete all fields.");return}await dbPut("contacts",{id:uid(),name,email,msg,at:nowISO()});await audit("contact",email);closeModal();toast("Message saved locally. In the live site this would email help@scholaris-learning.org.")};
}

function upgradeIcons(root=document.body){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode()){const n=walker.currentNode;if(n.parentElement&&!n.parentElement.closest('script,style,svg,textarea,option,.splash-title')&&[...n.nodeValue].some(c=>UI_ICONS[c]))nodes.push(n)}
 for(const n of nodes){const f=document.createDocumentFragment();let text='';for(const c of n.nodeValue){if(UI_ICONS[c]){if(text){f.append(document.createTextNode(text));text=''}const t=document.createElement('template');t.innerHTML=UI_ICONS[c];f.append(t.content.cloneNode(true))}else if(c!=='\ufe0f')text+=c}if(text)f.append(document.createTextNode(text));n.replaceWith(f)}
}
const iconObserver=new MutationObserver(()=>{iconObserver.disconnect();upgradeIcons();iconObserver.observe(document.body,{childList:true,subtree:true})});
iconObserver.observe(document.body,{childList:true,subtree:true});upgradeIcons();

/* ---------- Init ---------- */
(async function init(){
  applyA11y();
  const settings=await getSettings();
  if(settings.credentialsVersion!==2){await saveSettings({adminTokenHash:await sha256(ADMIN_DEFAULT_PW),credentialsVersion:2});LS.del("scholaris.adminToken")}
  currentUser=null;
  /* Seed default channels + welcome message */
  const msgs=await dbAll("messages");
  if(msgs.length===0){await dbPut("messages",{id:uid(),channel:"general",userId:"system",body:"Welcome to Scholaris Community! This chat runs locally in your browser.",at:nowISO()});await dbPut("messages",{id:uid(),channel:"announcements",userId:"system",body:"New games and lessons are added by admins from the Admin panel.",at:nowISO()})}
  renderFooter();renderAuthSlot();renderBanner();renderPanic();render();
  if(!location.hash)history.replaceState(null,"","#/");
